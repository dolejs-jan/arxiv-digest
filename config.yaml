# Keywords for LLM filtering of relevant papers
keywords:
  - "Adversarial Attacks"
  - "Malware"
  - "Antivirus"
  - "Large Language Models"
  - "Code Generation"

arxiv:
  categories:
    - "cs.CR" # Cryptography and Security
    # - "cs.LG" # Machine Learning
    # - "cs.SE" # Software Engineering
    # - "cs.CL" # Computation and Language
    # - "cs.AI" # Artificial Intelligence
  max_results: 1000

github:
  usernames:
    - "matouskozak"
  issue_label: "arxiv-summary"

llm_service:
  # Set the endpoint here or with LLM_BASE_URL. The API key is read from LLM_API_KEY.
  # Azure OpenAI v1: "https://<resource>.openai.azure.com/openai/v1/"
  # Microsoft Foundry v1: "https://<resource>.services.ai.azure.com/openai/v1/"
  # OpenAI: base_url: "https://api.openai.com/v1"
  # Local: base_url: "http://localhost:11434/v1"
  base_url: null

models:
  # Azure uses deployment names here.
  filter: "gpt-5-mini"
  summarize: "gpt-5"
